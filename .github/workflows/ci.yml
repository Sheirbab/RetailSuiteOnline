# -----------------------------------------------------------------------------
# CI: restore + build + test on every push and PR to main.
# A separate job builds the Docker image so the registry push step can be
# enabled later (commented out below — uncomment and fill the secrets when ready).
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Cache the NuGet package store across runs — knocks ~30s off subsequent builds.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RetailSuite.Api/RetailSuite.Api.csproj

      - name: Build
        run: dotnet build RetailSuite.Api/RetailSuite.Api.csproj --configuration Release --no-restore

      - name: Test
        # Run only the Tests project — separate restore so cache is honoured.
        run: |
          dotnet restore RetailSuite.Tests/RetailSuite.Tests.csproj
          dotnet test RetailSuite.Tests/RetailSuite.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only build the image on push to main — saves CI minutes on PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: retailsuite-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------
      # Uncomment + fill the secrets when you're ready to push.
      # ACR example:
      #   - REGISTRY_LOGIN_SERVER  = retailsuite.azurecr.io
      #   - REGISTRY_USERNAME      = (service principal app id)
      #   - REGISTRY_PASSWORD      = (service principal password)
