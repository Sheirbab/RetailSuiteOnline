# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - RetailSuiteAPI

on:
  push:
    branches:
      - claude/agitated-engelbart-5b1655
    paths:
      - 'RetailSuite.Api/**'
      - 'RetailSuite.Infrastructure/**'
      - 'RetailSuite.Shared/**'
      - '.github/workflows/claude-agitated-engelbart-5b1655_retailsuiteapi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build RetailSuite.Api/RetailSuite.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish RetailSuite.Api/RetailSuite.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02414F194B514A5BB3682FAC5DC11FD8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F74662F0D6C48378A4348FD2D1793DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04DDBED017164480A39505361AEDA5AD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'RetailSuiteAPI'
          slot-name: 'Production'
          package: .
          
